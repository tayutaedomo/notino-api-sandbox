name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: 静的チェック
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Yarnを準備
        run: npm install --global yarn@1.22.22

      - name: 依存関係をインストール
        run: yarn install --frozen-lockfile --non-interactive

      - name: Biomeの静的チェック
        run: yarn check:ci

      - name: YAMLの整形チェック
        run: yarn prettier --check ".github/workflows/*.{yml,yaml}"

      - name: 型チェック
        run: yarn typecheck

  unit:
    name: CLIと共通処理の単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Yarnを準備
        run: npm install --global yarn@1.22.22

      - name: 依存関係をインストール
        run: yarn install --frozen-lockfile --non-interactive

      - name: 単体テスト
        run: yarn test

  gcf:
    name: GCFのビルドとHTTPテスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Yarnを準備
        run: npm install --global yarn@1.22.22

      - name: 依存関係をインストール
        run: yarn install --frozen-lockfile --non-interactive

      - name: GCFのビルドとローカルHTTPテスト
        run: yarn test:http
